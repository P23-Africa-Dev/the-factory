# ─────────────────────────────────────────────────────────────────────────────
# secret.example.yaml  —  TEMPLATE ONLY. Never apply this file directly.
#
# Usage:
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # Edit k8s/secret.yaml and fill in all real values
#   kubectl apply -f k8s/secret.yaml
#
# Rules:
#   1. NEVER commit k8s/secret.yaml to version control.
#   2. Add `k8s/secret.yaml` to .gitignore before first commit.
#   3. All previously-exposed credentials MUST be rotated immediately.
#   4. For enterprise-grade secret management, migrate to:
#      - Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
#      - External Secrets Operator (https://external-secrets.io)
#      - DigitalOcean Secrets Manager via DOKS integration
#   5. For multi-replica file storage, upgrade FILESYSTEM_DISK from "local"
#      to "s3" and point to DigitalOcean Spaces (S3-compatible).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: factory23-secret
  namespace: factory23
type: Opaque
stringData:
  # ── Laravel Application ────────────────────────────────────────────────────
  # Generate with: php artisan key:generate --show
  # Format: base64:<32-byte-random-base64-string>
  APP_KEY: "base64:REPLACE_WITH_32_BYTE_BASE64_KEY"

  # ── DigitalOcean Managed Database ──────────────────────────────────────────
  # DB_HOST is set in configmap.yaml (factory23-config).
  DB_PASSWORD: "strong-password-16-chars-minimum"

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Leave empty string "" if no Redis auth (current default)
  REDIS_PASSWORD: ""
  TRACKING_WS_REDIS_PASSWORD: ""

  # ── OpenAI ────────────────────────────────────────────────────────────────
  # From: https://platform.openai.com/api-keys
  OPENAI_API_KEY: "sk-proj-..."

  # ── Anthropic ─────────────────────────────────────────────────────────────
  # From: https://console.anthropic.com/account/keys
  ANTHROPIC_API_KEY: "sk-ant-api03-..."

  # ── NVIDIA NIM ────────────────────────────────────────────────────────────
  # From: https://build.nvidia.com/settings/api-keys
  NVIDIA_API_KEY: "nvapi-..."

  # ── Zhipu GLM ─────────────────────────────────────────────────────────────
  # From: https://open.bigmodel.cn/usercenter/apikeys
  GLM_API_KEY: "..."

  # ── DigitalOcean Spaces (S3-compatible storage) ────────────────────────────
  # Bucket: factory23-storage (region: lon1)
  # Create key: doctl spaces keys create <name> --grants "bucket=factory23-storage;permission=readwrite"
  # IMPORTANT: Only put key + secret here — NOT AWS_URL (that belongs in configmap.yaml).
  AWS_ACCESS_KEY_ID: "DO00XXXXXXXXXXXXXXXXXXXX"
  AWS_SECRET_ACCESS_KEY: "your-spaces-secret-key-here"

  # ── Stripe ────────────────────────────────────────────────────────────────
  # From: https://dashboard.stripe.com/apikeys
  STRIPE_KEY: "pk_live_..."
  STRIPE_SECRET: "sk_live_..."

  # ── Mapbox ────────────────────────────────────────────────────────────────
  # From: https://account.mapbox.com/access-tokens/
  MAPBOX_PUBLIC_TOKEN: "pk.eyJ1Ijoi..."
  MAPBOX_SECRET_TOKEN: "sk.eyJ1Ijoi..."

  # ── Places Search providers (Laravel orchestrator) ────────────────────────
  # Geoapify (fan-out): https://myprojects.geoapify.com/
  GEOAPIFY_API_KEY: ""
  # Foursquare (fan-out): https://foursquare.com/developers/
  FOURSQUARE_API_KEY: ""
  # FOURSQUARE_BASE_URL: "https://places-api.foursquare.com"
  # FOURSQUARE_API_VERSION: "2025-06-17"
  # Google Places conditional backstop (Places API New):
  GOOGLE_PLACES_API_KEY: ""
  # Optional Places platform toggles (also overridable in Admin → Places):
  # PLACES_SHOW_PROVIDER_ATTRIBUTION: "true"
  # PLACES_FOURSQUARE_PREMIUM_FIELDS: "false"
  # PLACES_MAX_RESULTS_AUTOCOMPLETE: "12"
  # PLACES_MAX_RESULTS_SEARCH: "15"

  # ── Resend ────────────────────────────────────────────────────────────────
  # From: https://resend.com/api-keys
  RESEND_API_KEY: "re_..."

  # ── Google Calendar ───────────────────────────────────────────────────────
  # From: https://console.cloud.google.com/apis/credentials
  # GOOGLE_CALENDAR_REDIRECT_URI is set in configmap.yaml (factory23-config).
  GOOGLE_CALENDAR_CLIENT_ID: "153399553569-....apps.googleusercontent.com"
  GOOGLE_CALENDAR_CLIENT_SECRET: "GOCSPX-..."
  # Optional overrides for Email Accounts OAuth (defaults to calendar client):
  # GOOGLE_MAIL_CLIENT_ID / GOOGLE_MAIL_CLIENT_SECRET

  # ── Microsoft 365 / Outlook Mail ──────────────────────────────────────────
  # From: https://portal.azure.com → Microsoft Entra ID → App registrations
  # 1) Create (or open) the app → Overview → copy "Application (client) ID"
  # 2) Certificates & secrets → New client secret → copy the Value (NOT Secret ID)
  # 3) Authentication → Add platform → Web → Redirect URI must be exactly:
  #    https://api.thefactory23.com/api/v1/email-accounts/oauth/microsoft/callback
  # 4) Authentication → Supported account types:
  #    Include personal Microsoft accounts if users sign in with Outlook/Hotmail/Live,
  #    or require Microsoft 365 work/school accounts only.
  # 5) API permissions → Microsoft Graph delegated:
  #    openid, email, profile, offline_access, User.Read, Mail.ReadWrite, Mail.Send
  #    (then Grant admin consent if your tenant requires it)
  # Missing CLIENT_ID in the live cluster causes AADSTS900144 on Microsoft sign-in.
  # Personal MSA against a work-only app causes AADSTS500202 at token exchange.
  MICROSOFT_MAIL_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  MICROSOFT_MAIL_CLIENT_SECRET: "paste-secret-VALUE-not-secret-id"

  # ── Zoho Mail ─────────────────────────────────────────────────────────────
  # From: https://api-console.zoho.com/
  ZOHO_MAIL_CLIENT_ID: ""
  ZOHO_MAIL_CLIENT_SECRET: ""

  # ── Admin ─────────────────────────────────────────────────────────────────
  ADMIN_DEFAULT_PASSWORD: "strong-admin-password-min-16-chars"

  # ── Manage Database (Prime Reset Token) ───────────────────────────────────
  # Prime passcode reset token for the super-admin "Manage Database" module.
  # Only holders of this token can reset the database-manager passcode.
  # Generate with: openssl rand -hex 32
  # Rotate by updating this secret and running: kubectl rollout restart
  #   deployment/backend deployment/queue-worker deployment/scheduler -n factory23
  DB_MANAGER_MASTER_RESET_TOKEN: "REPLACE_WITH_64_HEX_CHAR_TOKEN"

  # ── Mail (SMTP via Resend) ────────────────────────────────────────────────
  MAIL_HOST: "smtp.resend.com"
  MAIL_PORT: "465"
  MAIL_USERNAME: "resend"
  MAIL_PASSWORD: "re_..."
  MAIL_ENCRYPTION: "tls"

  # ── Push notifications ────────────────────────────────────────────────────
  # Generate: npx web-push generate-vapid-keys
  # Public key must also be set on the Agent PWA as NEXT_PUBLIC_VAPID_PUBLIC_KEY.
  VAPID_PUBLIC_KEY: "REPLACE_WITH_VAPID_PUBLIC_KEY"
  VAPID_PRIVATE_KEY: "REPLACE_WITH_VAPID_PRIVATE_KEY"
  VAPID_SUBJECT: "mailto:info@thefactory23.com"
  # Firebase FCM HTTP v1 (recommended — Legacy API is deprecated/disabled)
  FCM_PROJECT_ID: "fcatory23-apk"
  # Paste the Firebase Admin SDK JSON as a single-line string, or base64(JSON).
  # Generate new private key from Firebase → Project settings → Service accounts.
  FCM_SERVICE_ACCOUNT_JSON: "REPLACE_WITH_FIREBASE_ADMIN_SDK_JSON_OR_BASE64"
  # Deprecated — only if Cloud Messaging API (Legacy) is enabled
  # FCM_SERVER_KEY: "REPLACE_WITH_FCM_SERVER_KEY"
